<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello world! — HackOnVibe</title>
<style>
:root{--bg:#10051f;--fg:#fff8ff;--muted:#c8b9d8;--accent:#19f7ff;--accent2:#ff4dd2}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:1.5rem;text-align:center}
main{max-width:36rem}
h1{font-size:clamp(2.6rem,9vw,4.5rem);line-height:1.05;margin:0 0 1rem;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);font-size:1.05rem;line-height:1.6;margin:0 0 .5rem}
.stamp{margin-top:2rem;font-size:.85rem;color:#9c8fb0}
</style>
</head>
<body>
<main>
  <h1>Hello world!</h1>
  <p>Our HackOnVibe November 2026 team repo is live.</p>
  <p>Repo access and the deploy pipeline both work. The real product is coming next.</p>
  <p class="stamp">Page loaded <span id="t">just now</span></p>
</main>
<script>
  document.getElementById("t").textContent = new Date().toLocaleString();
</script>
</body>
</html>
